[project]
name = "production-rag"
version = "0.1.0"
description = "Production agentic RAG system for arXiv papers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "ipykernel>=6.29,<8",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "src/test"]
